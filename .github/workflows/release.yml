name: Release

on:
  workflow_dispatch:

permissions:
  contents: write
  packages: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Prepare engine resources
        run: bash .github/scripts/download_stockfish.sh

      - name: Build
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ./gradlew :patches:buildAndroid --no-daemon
          set -- patches/build/libs/*.mpp
          test "$#" -eq 1 && test -f "$1"
          MPP="$1"
          cp "$MPP" "$RUNNER_TEMP/android-bundle.mpp"
          # generatePatchesList depends on the plain JVM jar task, which can replace the
          # Android DEX bundle at the same path. Generate metadata first, then restore the
          # verified Android bundle for the release.
          ./gradlew :patches:generatePatchesList --no-daemon
          cp "$RUNNER_TEMP/android-bundle.mpp" "$MPP"

      - name: Check bundle
        id: bundle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          set -- patches/build/libs/*.mpp
          test "$#" -eq 1 && test -f "$1"
          MPP="$1"
          python3 -c 'import sys,zipfile; z=zipfile.ZipFile(sys.argv[1]); assert z.testzip() is None; assert z.read("extensions/extension.mpe")[:4] == b"dex\n"; assert all(len(z.read(p)) > 1000000 for p in ["stockfish/arm64-v8a/stockfish", "stockfish/armeabi-v7a/stockfish"]); print("Bundle structure and CRCs verified")' "$MPP"
          gh release download v1.18.1 --repo MorpheApp/morphe-desktop --pattern morphe-desktop-1.18.1-all.jar --dir "$RUNNER_TEMP"
          python3 -c 'import hashlib,sys; assert hashlib.sha256(open(sys.argv[1],"rb").read()).hexdigest() == "1b506ab5f03d16a2f65026d5e0e1910d01fc1e2152f21eaeb44ed2f30856597b"' "$RUNNER_TEMP/morphe-desktop-1.18.1-all.jar"
          java -jar "$RUNNER_TEMP/morphe-desktop-1.18.1-all.jar" list-patches --patches "$MPP" --out "$RUNNER_TEMP/patch-list.txt"
          python3 -c 'import re,sys; text=open(sys.argv[1]).read(); names=re.findall(r"^Name: (.+)$",text,re.M); assert len(names)==8 and "Local Stockfish Analysis" in names; print("Official Morphe loader accepted all 8 patches")' "$RUNNER_TEMP/patch-list.txt"
          printf 'path=%s\n' "$MPP" >> "$GITHUB_OUTPUT"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          MPP: ${{ steps.bundle.outputs.path }}
        run: |
          set -euo pipefail
          VERSION=$(python3 -c 'from pathlib import Path; import re; print(re.search(r"(?m)^version\s*=\s*(.+)$",Path("gradle.properties").read_text()).group(1).strip())')
          TAG="v${VERSION}-build.${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}"
          sha256sum "$MPP" > "$RUNNER_TEMP/SHA256SUMS.txt"
          gh release create "$TAG" "$MPP" "$RUNNER_TEMP/SHA256SUMS.txt" "$RUNNER_TEMP/patch-list.txt" \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Patches ${VERSION}" --latest \
            --notes "Built from fork commit ${GITHUB_SHA}. Bundle integrity and the official Morphe patch loader were checked. APK/device integration was not tested."
          gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" > "$RUNNER_TEMP/release.json"
          python3 .github/scripts/update_bundle_metadata.py \
            --release-json "$RUNNER_TEMP/release.json" --bundle "$MPP" \
            --repository "$GITHUB_REPOSITORY" --version "$VERSION"
          git diff --exit-code "$GITHUB_SHA" -- README.md
          gh auth setup-git
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add patches-bundle.json patches-list.json
          git commit -m 'chore: update bundle metadata [skip ci]'
          git push origin HEAD:main
